name: Deploy
on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ghcr.io/charlesrogers/options-edge-finder:latest
            ghcr.io/charlesrogers/options-edge-finder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "http://95.216.205.160:8000/api/v1/deploy?uuid=ehb3y6xy08gbp2m0prs785yw&force=true"

      # A 200 on the homepage proves nothing — Next.js error boundaries return 200,
      # and /api/positions served {"error":"Unauthorized"} for ~4 months undetected.
      #
      # /api/positions is now behind the session gate, so "200" is no longer the
      # healthy answer for it — 401 is, and a 200 would mean the gate is OFF.
      # Two assertions, because each catches what the other cannot:
      #   1. /api/cron/health, bearer-authenticated, returns a body with "checks".
      #      That proves the container is up AND the service-role DB path works.
      #      Its HTTP code may legitimately be 503 (a stale heartbeat is a real
      #      alert, not a broken deploy), so assert on the body, not the code.
      #   2. /api/positions returns 401 unauthenticated. That proves the auth
      #      middleware is live in the image we just shipped.
      - name: Verify deploy is healthy
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET unset"; exit 1; fi
          for i in $(seq 1 20); do
            sleep 10
            CODE=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer $CRON_SECRET" \
              https://options.imprevista.com/api/cron/health || true)
            if grep -q '"checks"' /tmp/body 2>/dev/null; then
              echo "DB path healthy after $((i*10))s: /api/cron/health -> $CODE"
              head -c 300 /tmp/body; echo
              GATE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                https://options.imprevista.com/api/positions || true)
              if [ "$GATE" != "401" ]; then
                echo "::error::Auth gate NOT active — unauthenticated /api/positions returned $GATE, expected 401"
                exit 1
              fi
              echo "Auth gate active: unauthenticated /api/positions -> 401"
              exit 0
            fi
            echo "attempt $i: /api/cron/health -> $CODE $(head -c 160 /tmp/body 2>/dev/null)"
          done
          echo "::error::Deploy unhealthy — /api/cron/health never returned a checks body"
          exit 1

      - name: Alert Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "DISCORD_WEBHOOK unset"; exit 0; fi
          curl -s -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK" <<EOF
          {"embeds":[{"title":"🚨 options-edge-finder: Deploy FAILED","color":16711680,"fields":[{"name":"Run","value":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}],"footer":{"text":"production may be serving a broken build"}}]}
          EOF

      - name: Publish to dev blog
        if: success()
        env:
          BLOG_SECRET: ${{ secrets.BLOG_SECRET }}
        run: |
          TITLE=$(git log -1 --format="%s")
          BODY=$(git log -1 --format="%b")
          DIFF=$(git diff --stat HEAD~1 HEAD 2>/dev/null | tail -20)
          SUMMARY=$(echo "$BODY" | head -3)
          [ -z "$SUMMARY" ] && SUMMARY="$TITLE"
          curl -sf -X POST "https://dev.imprevista.com/api/blog/publish" \
            -H "Authorization: Bearer $BLOG_SECRET" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg product "Options Edge" \
              --arg title "$TITLE" \
              --arg summary "$SUMMARY" \
              --arg body "$(printf '%s\n\n## Files Changed\n\n```\n%s\n```' "$BODY" "$DIFF")" \
              --arg commit_sha "${{ github.sha }}" \
              --arg commit_url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
              --arg status "deployed" \
              '{product:$product, title:$title, summary:$summary, body:$body, commit_sha:$commit_sha, commit_url:$commit_url, status:$status}')" \
          || echo "::warning::Failed to publish to dev blog"
