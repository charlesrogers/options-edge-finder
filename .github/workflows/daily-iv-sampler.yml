name: Daily IV Sampler

on:
  schedule:
    # Run once per day at 3:55 PM ET (19:55 UTC) on weekdays
    # Near close = IV stabilized, tighter spreads, less noise
    - cron: '55 19 * * 1-5'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated tickers (leave empty for all ~350 defaults)'
        required: false
        type: string
      bootstrap:
        description: 'Run bootstrap mode (backfill 90 days of pseudo-IV)'
        required: false
        type: boolean
        default: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests numpy pandas scipy arch supabase

      - name: Run batch sampler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUIRE_SUPABASE: "1"
        run: |
          if [ "${{ github.event.inputs.bootstrap }}" = "true" ]; then
            if [ -n "${{ github.event.inputs.tickers }}" ]; then
              TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
              python batch_sampler.py --bootstrap $TICKERS
            else
              python batch_sampler.py --bootstrap
            fi
          elif [ -n "${{ github.event.inputs.tickers }}" ]; then
            TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
            python batch_sampler.py $TICKERS
          else
            python batch_sampler.py
          fi

      - name: Alert Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "DISCORD_WEBHOOK unset"; exit 0; fi
          curl -s -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK" <<EOF
          {"embeds":[{"title":"🚨 options-edge-finder: ${{ github.workflow }} FAILED","color":16711680,"fields":[{"name":"Run","value":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}],"footer":{"text":"scheduled job — 3+ consecutive failures is an incident"}}]}
          EOF
