name: Position Monitor (Pushover Alerts)

on:
  schedule:
    # Every 15 min during market hours: 9:30 AM - 4:00 PM ET
    # = 13:30 - 20:00 UTC (EST) or 14:30 - 21:00 UTC (EDT)
    # Using conservative range covering both
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # scipy is needed by bsm.py for the H19 shadow-mode delta. monitor_positions
      # imports it lazily and keeps alerting without it, but without scipy the
      # shadow log stays empty — so install it here rather than silently
      # collecting nothing for two weeks.
      - name: Install dependencies
        run: pip install requests numpy pandas scipy supabase yfinance

      - name: Import smoke test
        run: python3 -c "import monitor_positions, position_monitor, bsm"

      - name: Monitor positions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          REQUIRE_SUPABASE: "1"
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: python3 monitor_positions.py

      # The runner is ephemeral and emergency_shadow.jsonl is gitignored, so
      # without this the H19 shadow log is destroyed at the end of every run and
      # the pre-registered "2 weeks of shadow logging" would collect nothing.
      - name: Retain H19 shadow log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-shadow-${{ github.run_id }}
          path: emergency_shadow.jsonl
          retention-days: 90
          if-no-files-found: ignore

      - name: Alert Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "DISCORD_WEBHOOK unset"; exit 0; fi
          curl -s -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK" <<EOF
          {"embeds":[{"title":"🚨 options-edge-finder: ${{ github.workflow }} FAILED","color":16711680,"fields":[{"name":"Run","value":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}],"footer":{"text":"scheduled job — 3+ consecutive failures is an incident"}}]}
          EOF
