name: Tests

on:
  push:
    branches: [main]
  # Every PR, not only PRs targeting main. Research branches stack (a Phase 3 PR based on
  # a Phase 1 PR), and with a `branches: [main]` filter those PRs got no test signal at
  # all — the tests that guard financial logic simply did not run on the change that
  # introduced it.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # `requests` is needed to import monitor_positions — the failure-policy
        # tests exercise the live alerting path, so it must be importable here.
        run: pip install pytest numpy scipy pandas requests

      - name: Run tests
        env:
          # The trades-schema contract tests ask the live database whether the
          # columns the monitor reads still exist. Without credentials they skip,
          # which would make the check that matters most silently vacuous in CI.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pytest tests/ -v

      # Auth is the only thing standing between a stranger and a real portfolio's
      # positions. These checks are pure (no network, no DB) and exercise the
      # exact lib/auth.ts the middleware imports, via Node's type stripping.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Auth primitives
        run: node --experimental-strip-types web/scripts/check_auth.mjs

      # The two pure-TS modules behind the /positions staleness banner and the
      # /how-it-works live widgets. Both only tell the truth in states you
      # cannot produce by looking at the page — a stale chain, a failed run, an
      # unrecognised graveyard status — so they are exercised against fixtures.
      # Neither was running in CI before, which is the same "a check nobody
      # runs" shape as a red cron. Placed after Set up Node, which they need.
      - name: Pure-logic fixtures (freshness, live evidence)
        run: |
          node --experimental-strip-types scripts/check_freshness_fixture.mjs
          node --experimental-strip-types scripts/check_live_evidence_fixture.mjs

      # The NYSE session list is generated from `exchange_calendars`, not
      # maintained by hand (spec A6). If the library revises a holiday or the
      # committed range runs short, this fails here rather than silently
      # skewing every freshness check in the health endpoint.
      - name: NYSE calendar is current
        run: |
          pip install exchange_calendars
          python3 scripts/generate_nyse_calendar.py --check
