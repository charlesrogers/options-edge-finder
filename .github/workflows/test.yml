name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # `requests` is needed to import monitor_positions — the failure-policy
        # tests exercise the live alerting path, so it must be importable here.
        run: pip install pytest numpy scipy pandas requests

      - name: Run tests
        run: python -m pytest tests/ -v
