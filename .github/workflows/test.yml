name: Tests

on:
  push:
    branches: [main]
  # Every PR, not only PRs targeting main. Research branches stack (a Phase 3 PR based on
  # a Phase 1 PR), and with a `branches: [main]` filter those PRs got no test signal at
  # all — the tests that guard financial logic simply did not run on the change that
  # introduced it.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pytest numpy scipy pandas

      - name: Run tests
        run: python -m pytest tests/ -v
